<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>Sigit Live</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ app_version }}" />
  </head>
  <body>
    <nav class="top-nav" aria-label="Primary navigation">
      <a class="brand" href="/">Sigit Live</a>
      <div class="nav-links">
        <a class="nav-link active" href="/">Live</a>
        <a class="nav-link" href="/highlights">Library</a>
        <a class="nav-link" href="/settings">Settings</a>
        <button class="nav-link nav-button" type="button" data-logout>Sign out</button>
      </div>
    </nav>

    <main class="shell camera-shell">
      <section class="viewer">
        <img id="live-image" class="hidden" alt="Live view" />
        <div id="live-overlay" class="live-overlay">Connecting</div>
      </section>

      <aside class="panel">
        <div class="status-row">
          <span id="capture-dot" class="dot"></span>
          <span id="capture-label">Checking service</span>
        </div>
        <p id="device-info" class="device-info">Detecting sources</p>

        <section class="audio-meter" aria-labelledby="audio-meter-label">
          <div class="audio-meter-heading">
            <span id="audio-meter-label">Microphone</span>
            <span id="audio-meter-value">Waiting</span>
          </div>
          <div id="audio-meter-track" class="audio-meter-track" role="meter"
            aria-label="Microphone volume" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60">
            <span id="audio-meter-fill" class="audio-meter-fill"></span>
          </div>
          <p id="audio-meter-status" class="audio-meter-status">Waiting for input</p>
        </section>

        <section class="save-card" aria-labelledby="save-heading">
          <h2 id="save-heading">Save replay</h2>
          <div id="replay-presets" class="preset-buttons" data-default="{{ default_replay_seconds }}">
            {% for seconds in replay_presets %}
            <button type="button" class="preset-button" data-seconds="{{ seconds }}">{{ seconds }} sec</button>
            {% endfor %}
          </div>
          <button id="save-button" type="button">Save replay <span class="shortcut-hint">R</span></button>
          <p id="message" class="message" aria-live="polite"></p>
        </section>

        <dl class="stats">
          <div><dt>Available</dt><dd id="buffered">0 sec</dd></div>
          <div><dt>Storage free</dt><dd id="storage-free">Checking</dd></div>
          <div><dt>Backup</dt><dd id="backup-status">Checking</dd></div>
        </dl>
      </aside>
    </main>

    <script src="/static/common.js?v={{ app_version }}"></script>
    <script src="/static/app.js?v={{ app_version }}"></script>
  </body>
</html>
